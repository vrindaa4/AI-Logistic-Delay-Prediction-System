<div class="register-wrapper">
  <div class="register-card">

    <div class="register-header">
      <div class="logo-icon">🛡️</div>
      <h1>Create Admin</h1>
      <p class="subtitle">Register a new admin account</p>
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <input
        type="text"
        placeholder="Enter admin name"
        [(ngModel)]="name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        placeholder="Enter admin email"
        [(ngModel)]="email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        placeholder="Create a password"
        [(ngModel)]="password">
    </div>

    @if (errorMessage) {
      <div class="error-msg">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="success-msg">{{ successMessage }}</div>
    }

    <button
      class="register-btn"
      (click)="register()"
      [disabled]="loading">
      @if (!loading) {
        <span>🛡️ Create Admin Account</span>
      } @else {
        <span>Creating...</span>
      }
    </button>

    <button class="back-btn" (click)="goBack()">
      ← Back to Dashboard
    </button>

  </div>
</div>
